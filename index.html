<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Twix-opener — интерактивная 3D-модель</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 "Segoe UI",Tahoma,Arial,sans-serif;color:#e8e8e8;background:linear-gradient(#5a5a5a,#363636);overflow:hidden}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:8px 10px 8px 16px;background:rgba(25,25,25,.72);border:1px solid rgba(255,255,255,.12);border-radius:6px}
#lab{min-width:170px}
#lab.bad{color:#ff8a80}
#btn{font:inherit;font-weight:600;padding:7px 18px;border:1px solid #6f87a8;border-radius:4px;background:linear-gradient(#fff,#dde5f0);color:#1b1b1b;cursor:pointer}
#btn:hover{background:linear-gradient(#fff,#cddcf0)}
#btn[aria-pressed=true]{background:linear-gradient(#e0574a,#b8281c);border-color:#8e1d14;color:#fff}
#btn:focus-visible{outline:2px solid #6fb1ff;outline-offset:2px}
#hint{position:fixed;left:12px;bottom:8px;font-size:12px;color:#bdbdbd;text-shadow:0 1px 2px #000;pointer-events:none}
#load{position:fixed;inset:0;display:grid;place-items:center;background:#3b3b3b;color:#ddd;z-index:20;transition:opacity .3s}
@media (max-width:600px){#hint{display:none}#bar{width:calc(100% - 24px);justify-content:space-between}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="model-data.js"></script>
</head>
<body>
<canvas id="view"></canvas>
<div id="bar"><span id="lab">Выключено</span><button id="btn" aria-pressed="false">Включить</button></div>
<div id="hint">ЛКМ — вращение · ПКМ — сдвиг · колесо — масштаб · Пробел — вкл/выкл</div>
<div id="load">Загрузка модели…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============ ФИЗИКА И АВТОМАТИКА (СИ) ============ */
/*PHYS*/
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
// MG90S при 6 В: 2,2 кг·см = 0,216 Н·м, 0,1 с / 60° (≈ 13 рад/с)
const SV = { Tmax: 0.216, Wmax: 13, Kp: 40, Kt: 0.05, J: 2e-4, b: 3e-4, lim: 1.57 };
const G = {
  r: 0.010,        // делительный радиус шестерни, м (модуль 2, z = 10 по модели)
  arm: 0.020,      // плечо усилия захвата на качалке, м (отверстие качалки R = 20 мм)
  kc: 60,          // жёсткость контакта захвата с батончиком, Н/рад
  contact: 0.70,   // угол касания, рад
  Ftarget: 6,      // целевое усилие захвата, Н
  close: 1.0,      // максимальная команда на захват, рад
  Dp: 0.010, Dt: 0.006,          // ход рейки на прокол и на протяжку, м
  yPierce: -0.007, yTorn: 0.004, // положения, при которых упаковка проколота / снята
  Rbase: 0.6       // трение в направляющих рейки, Н
};
const STAGES = [
  { n: 'Захват', T: 2.0 }, { n: 'Прокол упаковки', T: 1.6 }, { n: 'Протяжка и снятие', T: 3.2 },
  { n: 'Отделение продукта', T: 2.0 }, { n: 'Готово', T: 1.0 }
];
const mk = () => ({ th: 0, w: 0, tau: 0 });
const S = {
  s1: mk(), s2: mk(), stage: -1, t: 0, time: 0, cycleT: 0, obj: false, F: 0, Fpeak: 0,
  pierced: false, torn: false, hold: false, tHold: 0, cmd1: 0, cmd2: 0, h1: 0, fault: '',
  cycles: 0, ok: 0, lastT: 0, lastPeak: 0, Ftear: 8, env: 22, Tin: 22, I1: 0, I2: 0, Ibat: 0,
  cycMAh: 0, lastMAh: 0, justFinished: false
};
function canStart() {
  if (S.stage >= 0) return 'Цикл уже идёт';
  if (S.fault) return 'Нажмите «Сброс»';
  if (!S.obj) return 'Нет батончика (датчик TCRT5000)';
  if (S.Tin >= 30) return 'Внутри слишком тепло: риск таяния';
  return '';
}
function start() {
  const why = canStart(); if (why) return why;
  Object.assign(S, { stage: 0, t: 0, cycleT: 0, pierced: false, torn: false, hold: false, Fpeak: 0, cycMAh: 0, cmd1: 0, cmd2: 0 });
  return '';
}
function resetAll() { Object.assign(S, { stage: -1, fault: '', t: 0, hold: false, cmd1: 0, cmd2: 0, pierced: false, torn: false }); }
function servo(sv, cmd, tauLoad, dt) {
  const wd = clamp(SV.Kp * (cmd - sv.th), -SV.Wmax, SV.Wmax);
  sv.tau = clamp(SV.Kt * (wd - sv.w), -SV.Tmax, SV.Tmax);
  sv.w += (sv.tau - tauLoad - SV.b * sv.w) / SV.J * dt;
  sv.th += sv.w * dt;
  if (Math.abs(sv.th) > SV.lim) { sv.th = Math.sign(sv.th) * SV.lim; sv.w = 0; }
}
function wrapR(y) {                // сопротивление упаковки движению рейки, Н
  if (S.torn) return G.Rbase;
  if (!S.pierced) return G.Rbase + 0.6 * S.Ftear * clamp((-0.002 - y) / 0.004, 0, 1);
  return G.Rbase + S.Ftear;
}
function fail(msg) { S.fault = msg; S.stage = -1; }
function next() { S.stage++; S.t = 0; }
function step(dt) {
  S.time += dt;
  S.F = (S.obj && S.stage >= 0) ? G.kc * Math.max(0, S.s1.th - G.contact) : 0;
  if (S.F > S.Fpeak) S.Fpeak = S.F;
  if (S.stage >= 0) {
    const st = STAGES[S.stage], u = S.t / st.T;
    S.t += dt; S.cycleT += dt;
    if (S.stage === 0) {
      if (!S.hold) { S.cmd1 = G.close * smooth(u); if (S.F >= G.Ftarget) { S.hold = true; S.cmd1 = S.s1.th; S.tHold = S.t; } }
      if (S.t >= st.T || (S.hold && S.t > S.tHold + 0.3)) { S.h1 = S.cmd1; next(); }
    } else if (S.stage === 1) {
      S.cmd2 = -(G.Dp / G.r) * smooth(u);
      if (S.t >= st.T) { if (!S.pierced || Math.abs(S.cmd2 - S.s2.th) > 0.3) fail('Перегрузка привода №2: упаковка не проколота'); else next(); }
    } else if (S.stage === 2) {
      S.cmd2 = -(G.Dp / G.r) + ((G.Dp + G.Dt) / G.r) * smooth(u);
      if (S.t >= st.T) { if (!S.torn) fail('Перегрузка привода №2: упаковка не снята'); else next(); }
    } else if (S.stage === 3) {
      S.cmd1 = S.h1 * (1 - smooth(u)); S.cmd2 = (G.Dt / G.r) * (1 - smooth(u));
      if (S.t >= st.T) next();
    } else if (S.stage === 4) {
      if (S.t >= st.T) {
        S.stage = -1; S.cycles++; S.ok++; S.lastT = S.cycleT; S.lastPeak = S.Fpeak; S.lastMAh = S.cycMAh;
        S.obj = false; S.justFinished = true;
      }
    }
  }
  servo(S.s1, S.cmd1, S.F * G.arm, dt);
  const y = G.r * S.s2.th, v = G.r * S.s2.w;
  if (!S.pierced && y < G.yPierce) S.pierced = true;
  if (S.pierced && !S.torn && y > G.yTorn) S.torn = true;
  servo(S.s2, S.cmd2, G.r * wrapR(y) * Math.tanh(v / 0.003), dt);
  // электрика: ток серво при 6 В, ESP32 ≈ 0,3 Вт, КПД LM2596 ≈ 85 %, аккумулятор 7,4 В
  const I = s => 0.012 + 0.70 * Math.min(1, Math.abs(s.tau) / SV.Tmax);
  S.I1 = I(S.s1); S.I2 = I(S.s2);
  const Pb = (6 * (S.I1 + S.I2 + 0.012) + 0.3) / 0.85;
  S.Ibat = Pb / 7.4; S.cycMAh += S.Ibat * dt / 3.6;
  S.Tin += ((0.25 * Pb) / 80 - (S.Tin - S.env) / 300) * dt;
}
/*ENDPHYS*/

/* ============ СЦЕНА ============ */
const canvas = document.getElementById('view'), vp = document.body;
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true }); }
catch (e) { document.getElementById('load').textContent = 'WebGL недоступен в этом браузере.'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 500);
scene.add(camera);
scene.add(new THREE.AmbientLight(0xffffff, 0.62));
const key = new THREE.DirectionalLight(0xffffff, 1.05); key.position.set(0.4, 0.8, 1); camera.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.35); fill.position.set(-1, -0.6, 0.5); camera.add(fill);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.minDistance = 6; controls.maxDistance = 90;

// CAD: Z вверх, мм → three: Y вверх, см. Центр сборки в начале координат.
const cad = new THREE.Group();
cad.rotation.x = -Math.PI / 2; cad.scale.setScalar(0.1); cad.position.set(-1.57, 0, -0.4);
scene.add(cad);

const MODEL = window.TWIX_MODEL;
const bin = Uint8Array.from(atob(MODEL.bin), c => c.charCodeAt(0)).buffer;
const WHEELS = [9, 12, 15, 18];

function makeGeometry(m) {
  const q = new Uint16Array(bin, m.po, m.nv * 3), pos = new Float32Array(m.nv * 3);
  for (let k = 0; k < pos.length; k++) pos[k] = m.lo[k % 3] + q[k] * m.step;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(bin, m.io, m.ni), 1));
  g.computeVertexNormals();
  return g;
}

// Названия даны по форме и цвету детали в STEP — при необходимости поправьте здесь.
const INFO = {
  0: ['Корпус с фланцем', 'Неподвижно. Цилиндрический фланец и короб с аркой.', [0, 0, 0]],
  1: ['Основание сервопривода №1', 'Неподвижно. Красная деталь, в ней стоит сервопривод №1.', [-45, 0, 0]],
  2: ['Захват (жёлтый)', 'Неподвижно. Жёлтый крюк рядом с сервоприводом №1.', [-30, 0, 18]],
  3: ['Сервопривод №1 MG90S', 'Неподвижно. Вал на оси X, на нём качалка.', [-20, 0, -26]],
  4: ['Качалка сервопривода №1', 'Движется: поворот вокруг оси X, угол до ±90°. Отверстия на радиусе 20 мм.', [-12, 0, 0]],
  5: ['Кронштейн сервопривода №2', 'Неподвижно. Держит сервопривод №2.', [0, 26, 12]],
  6: ['Сервопривод №2 MG90S', 'Неподвижно. Вал вертикальный, на нём шестерня.', [0, 40, 28]],
  7: ['Шестерня m = 2, z = 10', 'Движется: вращается вместе с валом сервопривода №2.', [0, 26, -26]],
  8: ['Рейка с наконечниками', 'Движется вдоль оси Y: ход = радиус шестерни × угол поворота.', [14, 26, -42]]
};
const meta = MODEL.parts, wheelMeta = WHEELS.map(i => meta[i]), unitOf = {};
WHEELS.forEach((w, k) => unitOf[w] = k + 1);
for (const m of meta) if (m.i >= 9 && !WHEELS.includes(m.i)) {
  let best = 0, bd = 1e9;
  wheelMeta.forEach((w, k) => { const d = Math.hypot(w.center[0] - m.center[0], w.center[2] - m.center[2]); if (d < bd) { bd = d; best = k; } });
  unitOf[m.i] = best + 1;
}

const parts = [];
let horn, gear, rack;
for (const m of meta) {
  let name, desc, off;
  if (INFO[m.i]) [name, desc, off] = INFO[m.i];
  else if (WHEELS.includes(m.i)) { name = 'Ролик ' + unitOf[m.i]; desc = 'Неподвижно. Ролик на оси X.'; off = [0, -34, 0]; }
  else {
    const w = wheelMeta[unitOf[m.i] - 1];
    name = 'Проушина ролика ' + unitOf[m.i]; desc = 'Неподвижно. Опора оси ролика.';
    off = [Math.sign(m.center[0] - w.center[0]) * 14, -34, Math.sign(m.center[2]) * 16];
  }
  const col = new THREE.Color().setRGB(m.col[0], m.col[1], m.col[2], THREE.SRGBColorSpace);
  const mat = new THREE.MeshPhongMaterial({ color: col, specular: 0x2a2a2a, shininess: 35, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(makeGeometry(m), mat);
  const wrap = new THREE.Group(), pivot = new THREE.Group();
  if (m.i === 7) { pivot.position.set(m.center[0], m.center[1], 0); mesh.position.set(-m.center[0], -m.center[1], 0); }
  pivot.add(mesh); wrap.add(pivot); cad.add(wrap);
  const rec = { m, name, desc, off, mesh, wrap, pivot, edges: null };
  parts.push(rec);
  if (m.i === 4) horn = rec;
  if (m.i === 7) gear = rec;
  if (m.i === 8) rack = rec;
}


/* ============ УПРАВЛЕНИЕ ============ */
const $ = id => document.getElementById(id);
camera.position.set(1, 0.75, 1.15).normalize().multiplyScalar(24);
controls.update();
$('load').style.opacity = 0; setTimeout(() => $('load').remove(), 350);

let on = false, pause = 0;
const btn = $('btn'), lab = $('lab');
function setOn(v) {
  on = v; pause = 0.5;
  btn.textContent = v ? 'Выключить' : 'Включить';
  btn.setAttribute('aria-pressed', v);
  if (!v) { const c1 = S.cmd1, c2 = S.cmd2; resetAll(); S.cmd1 = c1; S.cmd2 = c2; S.obj = false; }
}
btn.addEventListener('click', () => setOn(!on));
addEventListener('keydown', e => { if (e.code === 'Space' && !e.target.closest('button')) { e.preventDefault(); setOn(!on); } });

let last = performance.now(), acc = 0, hudT = 1;
const H = 1 / 4000;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;

  if (on && S.stage < 0 && !S.fault && (pause -= dt) <= 0) { S.obj = true; start(); pause = 0.8; }
  if (!on && S.stage < 0) {               // после выключения плавно возвращаем серво в нулевое положение
    const r = 1.5 * dt;
    S.cmd1 -= clamp(S.cmd1, -r, r); S.cmd2 -= clamp(S.cmd2, -r, r);
  }
  acc += dt;
  while (acc >= H) { step(H); acc -= H; }

  horn.pivot.rotation.x = S.s1.th;
  gear.pivot.rotation.z = S.s2.th;
  rack.pivot.position.y = G.r * S.s2.th * 1000;

  controls.update();
  renderer.render(scene, camera);
  if ((hudT += dt) > 0.1) {
    hudT = 0;
    lab.className = S.fault ? 'bad' : '';
    lab.textContent = S.fault ? S.fault : S.stage >= 0 ? STAGES[S.stage].n + ' · цикл ' + (S.cycles + 1) : on ? 'Ожидание цикла · готово ' + S.cycles : 'Выключено';
  }
  requestAnimationFrame(frame);
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w < h ? 48 : 32; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
